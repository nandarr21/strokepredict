<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StrokePredict{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary:      #1a6e99;
            --primary-dark: #114f70;
            --accent:       #e84c4c;
            --accent-soft:  #fde8e8;
            --success-soft: #e6f7ee;
            --bg-light:     #f0f6fb;
            --text-dark:    #1b2a38;
            --text-muted:   #6a7e8f;
            --card-shadow:  0 4px 24px rgba(26,110,153,.10);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .navbar {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            box-shadow: 0 2px 16px rgba(26,110,153,.25);
            padding: 0.75rem 0;
        }
        .navbar-brand {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            color: #fff !important;
            letter-spacing: -0.5px;
        }
        .navbar-brand .brand-dot { color: #f8c84e; }
        .nav-link {
            color: rgba(255,255,255,.85) !important;
            font-weight: 600;
            padding: .5rem 1rem !important;
            border-radius: 8px;
            transition: all .2s;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,.15);
            color: #fff !important;
        }

        /* ── Page hero ── */
        .page-hero {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, #2596c4 100%);
            color: #fff;
            padding: 3.5rem 0 3rem;
            position: relative;
            overflow: hidden;
        }
        .page-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .page-hero h1 { font-family: 'Nunito', sans-serif; font-weight: 900; }
        .page-hero .badge-hero {
            background: rgba(255,255,255,.18);
            color: #fff;
            font-size: .75rem;
            letter-spacing: 1px;
            padding: .35rem .8rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: .75rem;
        }

        /* ── Cards ── */
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: transform .25s, box-shadow .25s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(26,110,153,.15); }
        .card-header {
            border-radius: 16px 16px 0 0 !important;
            border-bottom: none;
        }

        /* ── Form controls ── */
        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #d0dde8;
            padding: .55rem .9rem;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,110,153,.12);
        }
        .form-label {
            font-weight: 700;
            font-size: .875rem;
            color: var(--text-dark);
            margin-bottom: .35rem;
        }
        .form-text { font-size: .78rem; color: var(--text-muted); }

        /* ── Buttons ── */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            font-weight: 700;
            letter-spacing: .3px;
            padding: .65rem 1.5rem;
            transition: transform .15s, box-shadow .15s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,110,153,.35);
        }
        .btn-danger {
            background: linear-gradient(135deg, #e84c4c, #c0392b);
            border: none;
            border-radius: 10px;
            font-weight: 700;
        }

        /* ── Section divider ── */
        .section-divider {
            width: 48px; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
            margin: .5rem 0 1.25rem;
        }

        /* ── Footer ── */
        footer {
            background: var(--primary-dark);
            color: rgba(255,255,255,.75);
            padding: 2rem 0;
            margin-top: auto;
        }
        footer a { color: rgba(255,255,255,.75); text-decoration: none; }
        footer a:hover { color: #fff; }

        /* ── Utilities ── */
        .text-primary-custom { color: var(--primary) !important; }
        .bg-primary-soft { background: rgba(26,110,153,.08); }
        main { flex: 1; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-heart-pulse-fill me-2"></i>Stroke<span class="brand-dot">Predict</span> 
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon" style="filter:invert(1)"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-house-door me-1"></i>Beranda
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict">
                        <i class="bi bi-activity me-1"></i>Prediksi
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">
                        <i class="bi bi-info-circle me-1"></i>Tentang
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── MAIN CONTENT ── -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- ── FOOTER ── -->
<footer>
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 mb-2 mb-md-0">
                <strong class="text-white">
                    <i class="bi bi-heart-pulse-fill me-1"></i>StrokePredict 
                </strong>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
